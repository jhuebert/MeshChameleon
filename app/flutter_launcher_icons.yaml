flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/icon.png"
  adaptive_icon_background: "assets/branding/icon_background.png"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  adaptive_icon_monochrome: "assets/branding/icon_monochrome.png"
  # The foreground/monochrome artwork is already drawn inside the 66/108
  # adaptive-icon safe zone, so no extra inset is applied here.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 24
