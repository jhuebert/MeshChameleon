name: meshchameleon
description: >-
  MeshChameleon: a virtual MeshCore companion. Holds a MeshCore identity on the
  phone and exposes a companion-protocol TCP server backed by a stock companion
  device used as a raw radio.
publish_to: none
version: 0.2.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  flutter_secure_storage: ^10.3.1
  flutter_blue_plus: ^1.35.3
  flutter_foreground_task: ^11.0.3
  path_provider: ^2.1.5
  mesh_protocol:
    path: ../packages/mesh_protocol
  companion_server:
    path: ../packages/companion_server
  mesh_node:
    path: ../packages/mesh_node
  device_link:
    path: ../packages/device_link
  package_info_plus: ^10.2.2
  cryptography: ^2.7.0
  flutter_file_dialog: ^3.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device hardware-in-the-loop tests (run with `flutter test integration_test
  # -d <device>`); never part of the default `flutter test` gate.
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Icon / splash generation from assets/branding (see the yaml configs).
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/branding/icon.png
